[package]
name = "rusti-transport-tls"
version = "0.1.0"
description = "Explicit, verified-TLS IRC transport; isolated from the portable Rust 1.70 core"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pskeffington/rusti_rc"
publish = false

[workspace]
resolver = "2"

[features]
default = []
os-keyring = ["dep:keyring"]

[dependencies]
rusti-client = { path = "../crates/rusti-client" }
rusti-proto = { path = "../crates/rusti-proto" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
zeroize = "=1.9.1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"], optional = true }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
