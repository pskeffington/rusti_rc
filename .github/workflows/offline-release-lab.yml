name: Offline signed-bundle verification lab

on:
  pull_request:
    paths:
      - scripts/verify_offline_bundle_lab.py
      - scripts/tests/test_offline_bundle_lab.py
      - .github/workflows/offline-release-lab.yml
  push:
    branches: [main]
    paths:
      - scripts/verify_offline_bundle_lab.py
      - scripts/tests/test_offline_bundle_lab.py
      - .github/workflows/offline-release-lab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rusti-offline-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-synthetic-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify offline test tools
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          openssl version

      - name: Verify syntactic integrity
        shell: bash
        run: |
          python3 -m py_compile scripts/verify_offline_bundle_lab.py \
            scripts/tests/test_offline_bundle_lab.py

      - name: Run ephemeral Ed25519 synthetic bundle tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests \
            -p 'test_offline_bundle_lab.py' -v

      - name: Confirm verifier has no installer or network operations
        shell: bash
        run: |
          set -euo pipefail
          # Source-level guard, not an independent security review.
          ! grep -E '^(import socket|from socket|import urllib|import requests)' \
            scripts/verify_offline_bundle_lab.py
          ! grep -E 'os\.system|shell=True|os\.exec|subprocess\.Popen' \
            scripts/verify_offline_bundle_lab.py

  # Synthetic private Ed25519 key exists only in the Python test temporary
  # directory, never committed or preserved as an Actions artifact.
  # Signature+SHA verification is NOT deployment approval. Trusted hardware
  # floor, TUF metadata, key revocation, target runtime remain unverified.
